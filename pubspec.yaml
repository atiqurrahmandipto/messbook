name: messbook
description: A digital mess management application for expense tracking, member management, meal scheduling, billing, and inventory management.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # Database
  sqflite: ^2.2.0
  path: ^1.8.0
  
  # API & Serialization
  json_serializable: ^6.5.0
  json_annotation: ^4.7.0
  
  # UI
  cupertino_icons: ^1.0.2
  intl: ^0.18.0
  
  # Storage
  shared_preferences: ^2.1.0
  
  # Utils
  uuid: ^3.0.7
  charts_flutter: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.3.0
  json_serializable: ^6.5.0

flutter:
  uses-material-design: true
